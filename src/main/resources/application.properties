#spring.application.name=UserAuthService
# 8001 for a single instance; start a second instance with SERVER_PORT=9001 so both register with Eureka
# under the same name (userservice) on different ports.
server.port=${SERVER_PORT:8001}

# Datasource. Defaults are for local dev; override via env vars in any other environment.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_auth_service}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate
# Turn on locally with logging.level.org.hibernate.SQL=DEBUG instead of dumping SQL to stdout everywhere.
spring.jpa.show-sql=true
# Entities are mapped to DTOs after the transaction ends; User.roles is EAGER to make that safe.
spring.jpa.open-in-view=false

# This DB already has tables from Hibernate's old ddl-auto=update; baseline it at V1
# so Flyway treats that schema as the starting point instead of trying to recreate it.
# Fresh databases (new envs, CI) have nothing to baseline and just run V1, V2, ... in full.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:migration

# JWT. The default below is for local dev only. Generate a real one with: openssl rand -base64 32
# (must decode to >= 32 bytes; the app refuses to start with a weaker key). Tokens survive restarts
# as long as this value is stable.
jwt.secret=${JWT_SECRET:f1tjC3meD88HAaOcSkFdUow6TiUon2mBind8khdPu2k=}
jwt.expiration=${JWT_EXPIRATION:24h}
jwt.issuer=user-auth-service

# How often expired-but-never-revisited sessions are swept to INACTIVE (ISO-8601 duration).
session.cleanup-interval=PT1H

# Kafka (localhost:9092 by default). Welcome and password-reset emails are published here for
# NotificationService. They are best-effort, so don't let an unreachable broker hold a request for the
# producer's default 60s metadata wait.
spring.kafka.producer.properties.max.block.ms=3000

# Password reset. delivery=kafka publishes the email to NotificationService (topic password-reset);
# delivery=log only writes the reset link to the application log, for local runs without Kafka.
password-reset.delivery=kafka
password-reset.expiration=15m
password-reset.link-base-url=http://localhost:3000/reset-password?token=

management.endpoints.web.exposure.include=health
# Silence "Using generated security password": there is no UserDetailsService in this app.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.application.name=userservice
