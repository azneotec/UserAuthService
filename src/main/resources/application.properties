spring.application.name=UserAuthService
server.port=8082

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://localhost:3306/user_auth_service
spring.datasource.username=root
spring.datasource.password=password

# This DB already has tables from Hibernate's old ddl-auto=update; baseline it at V1
# so Flyway treats that schema as the starting point instead of trying to recreate it.
# Fresh databases (new envs, CI) have nothing to baseline and just run V1, V2, ... in full.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:migration
